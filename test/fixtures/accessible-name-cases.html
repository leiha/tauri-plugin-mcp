<meta charset="utf-8">
<title>Cas adverses du nom accessible — fixture de vérification live</title>

<!--
  ⭐ POURQUOI CE FICHIER EXISTE, ET C'EST LA LEÇON LA PLUS CHÈRE DE CE MODULE.

  `accessibleNameSelector` a été réparé TROIS FOIS en une journée (2026-08-16).
  Les trois fois, la suite unitaire était VERTE et le lead a déclaré fini. Les
  trois fois, une main de falsification indépendante a tué la réparation.

  La cause n'était pas la difficulté du sujet, c'était le CHEMIN : les tests
  unitaires n'ont pas de DOM, ils ne peuvent donc épingler que la FORME du
  sélecteur. Le seul juge de la RÉSOLUTION est un vrai moteur CSS. Cette preuve-là
  était refaite à la main à chaque tour, puis perdue — un vert que personne ne
  pouvait rejouer, donc, comme l'a dit la falsification, « un vert qui ne peut pas
  rougir ».

  ⇒ Cette page est ce vert rendu REJOUABLE. Chaque élément porte un nom accessible
  construit pour casser une hypothèse précise.

  ⛔ LES ATTENTES NE SONT PAS DANS CE FICHIER, et ce n'est pas un oubli : elles
  vivent dans `live-check.mjs`, qui est ce qui JUGE. Une fixture qui porterait son
  propre verdict serait un juge et une partie. La règle générale est « le sélecteur
  attrape exactement un élément, le sien », mais trois cas y dérogent
  DÉLIBÉRÉMENT — `labelledby` (aucun sélecteur possible) et la paire `shared-a` /
  `shared-b` (deux éléments au même nom, dont le compte DOIT rendre 2, sans quoi
  le champ qui rapporte l'ambiguïté ne servirait à rien).

  ⚠ Les caractères exotiques sont écrits en ENTITÉS HTML, jamais en littéraux : un
  NBSP ou un BOM littéral est invisible en revue, invisible en diff, et rend
  `grep` muet sur le fichier entier.

  COMMENT LA REJOUER — voir `test/live-check.mjs`, en tête.
-->

<h1>Cas adverses — chaque bouton casse une hypothèse</h1>

<!-- ═══ Ce que le nom accessible sert à joindre en premier ═══ -->

<!-- Témoin : nom court et propre. Doit composer une égalité exacte. -->
<button id="plain" aria-label="Reglages">t</button>

<!-- Chacun des quatre attributs doit être reconnu et nommé. -->
<button id="from-alt" alt="Par alt">t</button>
<button id="from-placeholder" placeholder="Par placeholder">t</button>
<button id="from-title" title="Par title">t</button>

<!-- Le nom vit dans un AUTRE élément : aucun sélecteur ne peut le porter. -->
<span id="lbl">Ouvrir le panneau des reglages</span>
<button id="labelledby" aria-labelledby="lbl">t</button>

<!-- ═══ Tour 1 — l'échappement ═══ -->

<!-- Un guillemet ferme la chaîne : querySelector LÈVE au lieu de manquer. -->
<button id="quoted" title='il dit "bonjour" puis part'>t</button>
<!-- Un antislash mal traité casse l'échappement suivant. -->
<button id="backslash" title="chemin\vers\ailleurs">t</button>
<!-- Les opérateurs de sélecteur pris littéralement dans la valeur. -->
<button id="css-operators" title="a^=b ~= c |= d $= e *= f">t</button>
<!-- Crochets, qui pourraient fermer le sélecteur d'attribut. -->
<button id="brackets" title="tableau[0] et [1]">t</button>
<!-- Apostrophe et ponctuation CSS. -->
<button id="punctuation" title="l'ete ; {bloc} /* pas un commentaire */">t</button>

<!-- ═══ Tour 2 — la normalisation détruisait la valeur avant de composer ═══ -->

<!-- Le cas RÉEL trouvé dans ona/AtelierTab.svelte : doubles espaces. -->
<button id="double-space" placeholder="https://api.exemple.com/v1/x  —  ou  localhost:3000">t</button>
<!-- Espaces de bord, mangés par trim(). -->
<button id="edge-space" title=" Reglages ">t</button>
<!-- Espace insécable U+00A0 : `\s` le mange, le DOM le garde. -->
<button id="nbsp" aria-label="Ctrl&#160;+&#160;,">t</button>
<!-- Retour ligne : fait LEVER querySelector s'il n'est pas échappé en hex CSS. -->
<button id="newline" title="Ligne un&#10;Ligne deux">t</button>
<!-- Tabulation. -->
<button id="tab" title="colonne&#9;valeur">t</button>
<!-- Retour chariot. -->
<button id="carriage-return" title="avant&#13;apres">t</button>
<!-- Séparateur de ligne U+2028 et de paragraphe U+2029. -->
<button id="u2028" title="avant&#8232;apres">t</button>
<button id="u2029" title="avant&#8233;apres">t</button>
<!-- BOM U+FEFF au milieu. -->
<button id="feff" aria-label="zero&#65279;largeur">t</button>
<!-- Espace fine insécable U+202F et cadratin U+2003. -->
<button id="narrow-nbsp" title="12&#8239;345 unites">t</button>
<button id="em-space" title="large&#8195;espace">t</button>

<!-- ═══ Tour 2 — la coupe ne doit pas casser un caractère en deux ═══ -->

<!-- Emoji à cheval sur la borne du sélecteur (200) : coupe = surrogate isolé. -->
<button id="emoji-at-cut"
        title="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&#128190;fin">t</button>
<!-- Séquence ZWJ : la couper casse le graphème mais pas le sélecteur. -->
<button id="zwj-family" title="famille &#128104;&#8205;&#128105;&#8205;&#128103; au complet">t</button>
<!-- Emoji court, sans coupe. -->
<button id="emoji-short" aria-label="Enregistrer &#128190;">t</button>
<!-- Nom plus long que la borne d'AFFICHAGE (80) mais sous celle du sélecteur :
     doit composer une ÉGALITÉ exacte, pas un préfixe. -->
<button id="over-display-bound"
        title="Ce nom depasse volontairement la borne d affichage de quatre-vingts caracteres, mais reste bien en dessous de la borne du selecteur">t</button>

<!-- ═══ Écriture non latine ═══ -->

<button id="rtl-arabic" aria-label="&#1573;&#1594;&#1604;&#1575;&#1602; &#1575;&#1604;&#1604;&#1608;&#1581;&#1577;">t</button>
<button id="rtl-mark" title="mixte &#8207;droite-gauche&#8207; ici">t</button>
<button id="cjk" aria-label="&#35774;&#32622;&#65288;&#25171;&#24320;&#65289;">t</button>
<button id="soft-hyphen" title="cesure&#173;possible">t</button>
<button id="accents" aria-label="Réglages avancés — préférences">t</button>

<!-- ═══ Unicité : le sélecteur ne la promet pas, le COMPTE doit la dire ═══ -->

<!-- Deux éléments au même nom : le compte doit rendre 2, pas 1. -->
<button id="shared-a" aria-label="Fermer onglet">t</button>
<button id="shared-b" aria-label="Fermer onglet">t</button>
<!-- Un parent et son enfant au même nom : le `=` seul les attrape tous deux ;
     la qualification par balise les sépare (div vs button). -->
<div id="nested-parent" role="button" aria-label="Zone repliable">
  <button id="nested-child" aria-label="Zone repliable">t</button>
</div>
