[package]
name = "tauri-plugin-mcp"
version = "0.1.0"
authors = [ "Pegleg" ]
description = "A Tauri plugin that enables AI agents to interact with GUIs through screenshots, DOM access, and input simulation utilizing MCP"
edition = "2024"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mcp"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
image = { version = "0.25", features = ["jpeg", "png"] }
interprocess = { version = "2.2.3", features = ["tokio"] }
log = "0.4"
serde = "1.0"
serde_json = "1.0"
tauri = { version = "2.10", features = ["unstable"] }
thiserror = "2"
subtle = "2"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.22.3"
foreign-types-shared = "0.1"
xcap = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
xcap = "0.9"
# Reached through `with_webview` to relax the mixed-content refusal in debug builds —
# see `relax_mixed_content` in `src/lib.rs`. Version pinned to what wry already resolves,
# so no second copy of the bindings enters the tree.
webkit2gtk = "2.0"
# Encodes the Cairo surface that `WebViewExt::snapshot` hands back — see
# `tools/capture.rs`. It was ALREADY in the tree transitively (webkit2gtk depends on
# it); declaring it here only makes it nameable, and the version tracks what
# webkit2gtk 2.0.2 resolves (0.18.5). ⚠ A different major here would put a SECOND
# copy of cairo in the tree, and the two `Surface` types would not be the same type —
# a confusing mismatch error at a call site that looks correct.
# The `png` feature is what provides `ImageSurface::write_to_png`; without it the
# snapshot can be taken and not written.
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
win-screenshot = "4.0.5"

[features]
default = []
devtools = ["tauri/devtools"]
# Lets a debug build load http sub-resources from an https page. OFF by default:
# it lowers a real security boundary, and only a development host should ask for it.
insecure-content = []

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }


[profile.dev.package."*"]
opt-level = 0  # Force dependencies to compile with minimal optimization
